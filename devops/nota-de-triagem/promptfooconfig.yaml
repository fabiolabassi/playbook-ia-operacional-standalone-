prompts:
  - file://prompt.md

providers:
  - openai:gpt-4o-mini
  - id: ollama:chat:qwen3:0.6b
    config:
      think: false
      temperature: 0.1
      num_predict: 256
      keep_alive: 5m

tests:
  - vars:
      alerta_cru: |
        2026-05-12 14:02:09 UTC [Sentinel] autoscaler hit max replicas (60/60) on sentinel-api,
        queue depth on Relay growing 2k/min, CPU avg 88%, tenant stark-industries
        sending 4x baseline volume after onboarding new region
    assert:
      - type: contains
        value: "ALERTA:"
      - type: contains
        value: "IMPACTO:"
      - type: contains
        value: "HIPÓTESE INICIAL:"
      - type: contains
        value: "AÇÃO IMEDIATA:"
      - type: contains
        value: "ESCALAR PARA:"
      - type: regex
        value: "ESCALAR PARA:.*@\\w+"
      - type: javascript
        value: "output.trim().split(/\\r?\\n/).length <= 8"
      - type: latency
        threshold: 5000
      - type: cost
        threshold: 0.01

  - vars:
      alerta_cru: |
        2026-05-13 03:11:00 UTC [Relay] ingest reject rate 6% for 8min, tenant wakanda-systems,
        buffer saturated after deploy 02:55
    assert:
      - type: contains
        value: "ALERTA:"
      - type: contains
        value: "IMPACTO:"
      - type: contains
        value: "HIPÓTESE INICIAL:"
      - type: contains
        value: "AÇÃO IMEDIATA:"
      - type: contains
        value: "ESCALAR PARA:"
      - type: regex
        value: "ESCALAR PARA:.*@\\w+"
      - type: javascript
        value: "output.trim().split(/\\r?\\n/).length <= 8"
      - type: latency
        threshold: 5000
      - type: cost
        threshold: 0.01

  - vars:
      alerta_cru: |
        2026-05-13 11:40:22 UTC [Forge] consumer lag 9min and climbing, batch forge-batch-ingest
        delayed after previous job failure, downstream Sentinel starting to lag
    assert:
      - type: contains
        value: "ALERTA:"
      - type: contains
        value: "IMPACTO:"
      - type: contains
        value: "HIPÓTESE INICIAL:"
      - type: contains
        value: "AÇÃO IMEDIATA:"
      - type: contains
        value: "ESCALAR PARA:"
      - type: regex
        value: "ESCALAR PARA:.*@\\w+"
      - type: javascript
        value: "output.trim().split(/\\r?\\n/).length <= 8"
      - type: latency
        threshold: 5000
      - type: cost
        threshold: 0.01
