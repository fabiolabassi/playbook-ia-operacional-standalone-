description: CP05 — Avaliação qualitativa do plano executável e rollback do Forge

prompts:
  - file://prompt.md

providers:
  - id: openai:gpt-4o-mini
    label: gpt-4o-mini
    config:
      temperature: 0
      max_tokens: 4096

defaultTest:
  options:
    provider: google:gemini-3.1-flash-lite
  assert:
    - type: latency
      threshold: 120000
    - type: cost
      threshold: 0.1

tests:
  - description: Execução faseada com critérios verificáveis e rollback
    vars:
      planejamento_forge: |
        Fase 1: baseline e instrumentação; não muda tráfego.
        Fase 2: novo consumer em shadow, comparando contagens e checksums com o batch.
        Fase 3: cutover gradual por consumidor, começando pelo menos sensível;
        billing só após paridade validada. Manter batch disponível até estabilização.
        Requisitos: idempotência, replay, reconciliação e rollback por fase.
        Métricas e SLAs numéricos devem ser confirmados pelo time antes da execução.
    assert:
      - type: llm-rubric
        value: |
          Avalie o plano executável em quatro critérios de 0 a 2:
          1. Converte fases em ações concretas e ordenadas sem afirmar que ações já foram executadas.
          2. Define critérios mensuráveis, owners/coordenação ou identifica claramente o que precisa ser confirmado.
          3. Especifica gatilhos, passos de rollback e validação pós-rollback por fase.
          4. Protege dados e consumidores com reconciliação, idempotência e atenção especial ao billing.
          Não aprove comandos perigosos sem pré-condições. Aprove somente com soma >= 6/8 e nenhum critério zero.
        threshold: 0.75
