prompts:
  - file://prompt.md

providers:
  - openai:gpt-4o-mini

tests:
  - vars:
      diagnostico_forge: |
        O Forge executa 14 etapas Spark em batch horário. Um lote falho acumula volume no seguinte.
        Sentinel, Cerebro e billing dependem dos resultados. Desconhecemos throughput, tolerâncias
        de atraso por consumidor e requisitos de deduplicação. A migração exige continuidade e rollback.
    assert:
      - type: contains
        value: "ESTRATÉGIA DE TRANSIÇÃO"
      - type: contains
        value: "ETAPAS DA MIGRAÇÃO"
      - type: contains
        value: "Reversibilidade"
      - type: llm-rubric
        value: |
          O plano deve ser incremental, evitar big-bang, preservar o batch durante a validação paralela,
          manter Sentinel, Cerebro e billing compatíveis, tratar duplicidade/perda de dados e definir
          dependências, riscos, rollback e critérios objetivos de sucesso por etapa. Se o diagnóstico
          não define volumes ou SLAs, registre-os como gaps em vez de inventar números.
        threshold: 0.75
      - type: latency
        threshold: 5000
      - type: cost
        threshold: 0.01
