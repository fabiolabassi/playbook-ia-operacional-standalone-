prompts:
  - file://prompt.md

providers:
  - openai:gpt-4o-mini

tests:
  - vars:
      manifesto_permissivo: |
        # manifesto barrado pela revisão de segurança — permissivo demais
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: sentinel-allow
          namespace: sentinel-prod
        spec:
          podSelector: {}          # aplica a todos os pods do namespace
          policyTypes:
            - Ingress
            - Egress
          ingress:
            - {}                   # libera QUALQUER origem
          egress:
            - {}                   # libera QUALQUER destino
      regras_seguranca: |
        NetworkPolicy para o namespace "sentinel-prod":
        - pods do Sentinel só aceitam tráfego de entrada do Relay (consumo de eventos) e do gateway de API da plataforma
        - pods do Sentinel só fazem saída para: Forge (warehouse, porta 5432), Cerebro (busca, porta 9200) e DNS interno
        - nada de "allow all" em ingress ou egress
        - política default-deny explícita no namespace
        - toda regra precisa de comentário dizendo qual fluxo legítimo ela libera
      mapa_servicos: |
        - Sentinel     → namespace sentinel-prod, pods com label app=sentinel
        - Relay        → namespace relay-prod,    pods com label app=relay
        - API gateway  → namespace edge,          pods com label app=api-gateway
        - Forge        → namespace forge-prod,    pods com label app=forge,   porta 5432 (Postgres do warehouse)
        - Cerebro      → namespace cerebro-prod,  pods com label app=cerebro, porta 9200 (Elasticsearch)
        - DNS interno  → namespace kube-system,   pods com label k8s-app=kube-dns, porta 53
    assert:
      - type: javascript
        value: "output.split('---').length === 2 && (output.match(/kind: NetworkPolicy/g) || []).length === 2"
      - type: javascript
        value: "output.includes('sentinel-default-deny') && output.includes('sentinel-allow-required-flows') && output.includes('policyTypes:') && output.includes('Ingress') && output.includes('Egress') && output.split('---')[0].includes('podSelector: {}') && !output.split('---')[0].includes('ingress:') && !output.split('---')[0].includes('egress:')"
      - type: not-contains
        value: "- {}"
      - type: javascript
        value: "output.includes('5432') && output.includes('9200') && output.includes('protocol: UDP') && output.includes('port: 53')"
      - type: javascript
        value: "output.includes('app: relay') && output.includes('app: api-gateway') && output.includes('app: forge') && output.includes('app: cerebro') && output.includes('k8s-app: kube-dns')"
      - type: javascript
        value: "(output.match(/# Permite/g) || []).length >= 5 && output.includes('protocol: TCP') && output.includes('protocol: UDP')"
      - type: latency
        threshold: 5000
      - type: cost
        threshold: 0.01
