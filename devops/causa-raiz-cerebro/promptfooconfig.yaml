prompts:
  - file://prompt.md

providers:
  - id: openai:gpt-4o-mini
    label: gpt-4o-mini
    config:
      temperature: 0
      max_tokens: 4096

defaultTest:
  options:
    provider: google:gemini-3.1-flash-lite
  assert:
    - type: latency
      threshold: 120000
    - type: cost
      threshold: 0.1

tests:
  - vars:
      config_cerebro: |
        # cerebro.yaml — configuração do cluster Elasticsearch (repositório de infra)
        cerebro:
          shards: 12
          replicas_per_shard: 1
          jvm_heap: 8g
          refresh_interval: 1s
          reindex_job:
            schedule: "0 2 * * *"
            avg_duration_min: 90
          query_cache:
            enabled: true
            size_mb: 512
      metricas_cerebro: |
        timestamp              search_p99_ms   indexed_docs_per_s   heap_used_pct   cache_hit_pct
        2026-05-13 08:00 UTC   850             4200                 61              74
        2026-05-13 08:30 UTC   1100            4100                 68              71
        2026-05-13 09:00 UTC   2300            9800                 79              58
        2026-05-13 09:30 UTC   4100            11200                88              41
        2026-05-13 10:00 UTC   6700            12400                94              29
      logs_cerebro: |
        [2026-05-13T08:02:11,540][INFO ][o.e.t.LoggingTaskListener][cerebro-node-3] reindex task [88123] progress, created [3.8M]/[10M] docs (38%)
        [2026-05-13T08:14:33,019][WARN ][o.e.m.j.JvmGcMonitorService][cerebro-node-3] [gc][young] duration [620ms], collections [1] in [10s], heap [4.9gb]->[3.1gb]/[8gb]
        [2026-05-13T08:41:07,222][INFO ][o.e.i.IndexingMemoryController][cerebro-node-3] now throttling indexing for shard [logs-2026.05][7]: segment writing can't keep up
        [2026-05-13T09:03:55,810][WARN ][o.e.t.ThreadPool][cerebro-node-3] write thread pool queue at [150/200]
        [2026-05-13T09:12:48,402][WARN ][o.e.m.j.JvmGcMonitorService][cerebro-node-3] [gc][old] duration [1.1s], collections [2] in [60s], heap [6.3gb]->[5.9gb]/[8gb]
        [2026-05-13T09:20:02,118][INFO ][o.e.t.LoggingTaskListener][cerebro-node-3] reindex task [88123] progress, created [4.0M]/[10M] docs (40%)
        [2026-05-13T09:31:17,653][WARN ][o.e.i.b.HierarchyCircuitBreakerService][cerebro-node-3] [parent] usage [6.9gb/8gb] (86%), approaching limit
        [2026-05-13T09:44:29,901][WARN ][o.e.s.SearchService][cerebro-node-3] slow query on shard [logs-2026.05][7] took [2380ms]
        [2026-05-13T09:51:08,377][WARN ][o.e.t.ThreadPool][cerebro-node-3] write thread pool queue at [188/200]
        [2026-05-13T09:58:41,102][WARN ][o.e.t.ThreadPool][cerebro-node-3] write thread pool queue full [200/200], rejecting bulk — EsRejectedExecutionException
        [2026-05-13T09:58:43,210][WARN ][o.e.m.j.JvmGcMonitorService][cerebro-node-3] [gc][old] duration [1.8s], collections [4] in [60s], heap [7.6gb]->[7.4gb]/[8gb]
        [2026-05-13T09:58:44,005][INFO ][o.e.t.LoggingTaskListener][cerebro-node-3] reindex task [88123] still running, created [4.1M]/[10M] docs (41%), ETA unknown
        [2026-05-13T09:58:45,889][WARN ][o.e.i.IndexingMemoryController][cerebro-node-3] indexing buffer above limit, throttling shard [logs-2026.05][7]
        [2026-05-13T09:58:46,330][DEBUG][o.e.s.query.QueryPhase][cerebro-node-3] shard [logs-2026.05][7] search took [5031ms] (timeout [5000ms])
        [2026-05-13T09:58:46,512][ERROR][o.e.s.SearchService][cerebro-node-3] search returned partial results: 11/12 shards succeeded
        [2026-05-13T09:58:46,701][WARN ][o.e.i.b.HierarchyCircuitBreakerService][cerebro-node-3] [parent] circuit breaker tripped, usage [7.7gb/8gb] (96%) over limit
        [2026-05-13T09:58:47,001][WARN ][o.e.i.cache.query.IndicesQueryCache][cerebro-node-3] query cache eviction rate spiking, hit_ratio dropped to 0.29
        [2026-05-13T10:01:12,778][ERROR][o.e.s.SearchService][cerebro-node-3] CircuitBreakingException: [parent] Data too large, would be [7.9gb/8gb]
        [2026-05-13T10:03:39,255][WARN ][o.e.t.ThreadPool][cerebro-node-3] write thread pool rejected [1284] bulk requests in last 5min
        [2026-05-13T10:05:50,640][ERROR][o.e.s.SearchService][cerebro-node-3] all shards failed for index [logs-2026.05] on 3 of last 20 queries
    assert:
      - type: llm-rubric
        value: |
          Avalie com rigor e pontue somente o que a resposta sustenta com evidências dos dados fornecidos.
          Não trate correlação como causalidade; hipóteses devem estar identificadas. Uma afirmação
          material contradita ou sem suporte zera o critério afetado.
          Julgue a resposta como analista de incidentes. Dê nota de 0 a 2 em cada critério:
          (1) identifica a reindexação atrasada como causa, distinguindo-a de heap/cache/timeouts;
          (2) explica a sequência causal com evidências dos artefatos, sem inverter eventos;
          (3) recomenda contenção e correção de fundo proporcionais, sem ação destrutiva não justificada;
          (4) explicita lacunas dos dados e não inventa fatos.
          Aprove apenas se a soma for >= 6/8 e nenhum critério receber zero. Considere a resposta inteira,
          não exija formato de saída artificial. Responda com veredito e justificativa concisa.
          Contexto de referência: a reindexação está agendada para 02:00, com duração média configurada
          de 90 minutos, mas ainda aparece em execução a 41% às 09:58. Entre 08:00 e 10:00, o throughput
          de indexação sobe de 4.200 para 12.400 docs/s, heap de 61% para 94%, p99 de 850 para 6.700 ms
          e hit ratio do cache cai de 74% para 29%. Os logs mostram throttling às 08:41, fila de escrita
          em 200/200 e rejeições de bulk às 09:58, circuit breaker no mesmo minuto e buscas lentas,
          parciais e falhas depois. Esses dados mostram correlação temporal, não atribuição direta de
          consumo de heap à tarefa de reindexação.
          Escala de pontuação por critério:
          (1) 0 = causa errada/ausente; 1 = reindex ou heap mencionados sem conexão suficiente;
              2 = reindexação como provável gatilho, distinguida de mecanismos/sintomas.
          (2) 0 = sequência ausente/invertida; 1 = sequência parcial; 2 = cronologia sustentada por
              throughput/heap, throttling/fila, rejeições/circuit breaker e falhas de busca.
          (3) 0 = ação inútil/arriscada; 1 = ação relevante porém vaga; 2 = contenção reversível,
              validação observável e correção do ritmo/concorrência, sem presumir que aumentar heap resolva.
          (4) 0 = fato inventado ou certeza indevida; 1 = incerteza genérica; 2 = limites específicos
              da evidência e verificações necessárias. Afirmação material sem suporte zera o critério afetado.
        threshold: 0.75
