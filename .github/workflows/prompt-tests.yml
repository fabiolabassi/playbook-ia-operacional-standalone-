name: Prompt Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'devops/**'
      - '.github/workflows/prompt-tests.yml'
  push:
    branches: [main]
    paths:
      - 'devops/**'
      - '.github/workflows/prompt-tests.yml'
  workflow_dispatch:

jobs:
  prompt-tests:
    name: Run promptfoo tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate OpenAI secret
        shell: bash
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run tests for nota-de-triagem
        id: nota-de-triagem
        continue-on-error: true
        run: promptfoo eval -c devops/nota-de-triagem/promptfooconfig.yaml -o results/nota-de-triagem.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run tests for triagem-de-pods
        id: triagem-de-pods
        continue-on-error: true
        run: promptfoo eval -c devops/triagem-de-pods/promptfooconfig.yaml -o results/triagem-de-pods.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run tests for networkpolicy-sentinel
        id: networkpolicy-sentinel
        continue-on-error: true
        run: promptfoo eval -c devops/networkpolicy-sentinel/promptfooconfig.yaml -o results/networkpolicy-sentinel.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run tests for causa-raiz-cerebro
        id: causa-raiz-cerebro
        continue-on-error: true
        run: promptfoo eval -c devops/causa-raiz-cerebro/promptfooconfig.yaml -o results/causa-raiz-cerebro.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Comment results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsDir = 'results';

            let comment = '## Prompt Test Results\n\n';

            const prompts = [
              { name: 'nota-de-triagem', file: 'nota-de-triagem.json' },
              { name: 'triagem-de-pods', file: 'triagem-de-pods.json' },
              { name: 'networkpolicy-sentinel', file: 'networkpolicy-sentinel.json' },
              { name: 'causa-raiz-cerebro', file: 'causa-raiz-cerebro.json' }
            ];

            for (const prompt of prompts) {
              const filePath = `${resultsDir}/${prompt.file}`;

              if (!fs.existsSync(filePath)) {
                comment += `### ${prompt.name}: SKIPPED (no output file)\n\n`;
                continue;
              }

              let data;
              try {
                data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              } catch (error) {
                comment += `### ${prompt.name}: ERROR (JSON inválido)\n\n`;
                continue;
              }

              const rawResults = data && data.results;
              const results = Array.isArray(rawResults)
                ? rawResults
                : (rawResults && typeof rawResults === 'object'
                    ? Object.values(rawResults)
                    : []);

              let passCount = 0;
              let failCount = 0;

              for (const result of results) {
                if (result && result.success) {
                  passCount++;
                } else {
                  failCount++;
                }
              }

              const status = failCount === 0 ? 'PASS' : 'FAIL';
              comment += `### ${prompt.name}: ${status} (${passCount}/${passCount + failCount})\n\n`;

              if (failCount > 0) {
                comment += '**Failed tests:**\n';
                for (const result of results) {
                  if (!result || result.success) continue;
                  const label = result.prompt?.label || result.description || 'unknown';
                  const err = result.error || 'Assert failed';
                  comment += `- Test: ${label}\n`;
                  comment += `  Error: ${err}\n\n`;
                }
              }
            }

            comment += '\n---\n\n*Generated by promptfoo*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-test-results
          path: results/
