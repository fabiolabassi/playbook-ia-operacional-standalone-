name: Prompt Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "devops/**"
      - ".github/workflows/prompt-tests.yml"
  push:
    branches: [main]
    paths:
      - "devops/**"
      - ".github/workflows/prompt-tests.yml"
  workflow_dispatch:

concurrency:
  group: prompt-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_prompts: ${{ steps.matrix.outputs.has_prompts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select prompt configurations
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const all = [
            ['nota-de-triagem', 'devops/nota-de-triagem/promptfooconfig.yaml'],
            ['triagem-de-pods', 'devops/triagem-de-pods/promptfooconfig.yaml'],
            ['networkpolicy-sentinel', 'devops/networkpolicy-sentinel/promptfooconfig.yaml'],
            ['causa-raiz-cerebro', 'devops/causa-raiz-cerebro/promptfooconfig.yaml'],
            ['backpressure-relay', 'devops/backpressure-relay/promptfooconfig.yaml'],
            ['migracao-forge-diagnostico', 'devops/migracao-forge-diagnostico/promptfooconfig.yaml'],
            ['migracao-forge-planejamento', 'devops/migracao-forge-planejamento/promptfooconfig.yaml'],
            ['migracao-forge-execucao', 'devops/migracao-forge-execucao/promptfooconfig.yaml'],
          ];
          let selected = all;
          if (process.env.EVENT_NAME === 'pull_request') {
            const changed = execFileSync('git', [
              'diff', '--name-only', process.env.BASE_SHA, process.env.HEAD_SHA,
            ], { encoding: 'utf8' }).split(/\r?\n/).filter(Boolean);
            const workflowChanged = changed.includes('.github/workflows/prompt-tests.yml');
            if (!workflowChanged) {
              const dirs = new Set(changed
                .filter((file) => file.startsWith('devops/'))
                .map((file) => file.split('/').slice(0, 2).join('/')));
              selected = all.filter(([, config]) => dirs.has(config.split('/').slice(0, 2).join('/')));
            }
          }
          const include = selected
            .filter(([, config]) => fs.existsSync(config))
            .map(([name, config]) => ({ name, config }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `matrix=${JSON.stringify({ include })}`,
            `has_prompts=${include.length ? 'true' : 'false'}`,
            '',
          ].join('\n'));
          NODE

  eval:
    name: Evaluate ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.has_prompts == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate provider secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY is not configured"; exit 1; }
          test -n "$GOOGLE_API_KEY" || { echo "::error::GOOGLE_API_KEY is not configured"; exit 1; }

      - name: Run Promptfoo evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p results
          npx --yes promptfoo@0.125.1 eval \
            -c "${{ matrix.config }}" \
            --no-cache \
            --no-progress-bar \
            -o "results/${{ matrix.name }}.json"

      - name: Upload evaluation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-${{ matrix.name }}
          path: results/${{ matrix.name }}.json
          if-no-files-found: ignore
          retention-days: 14

  comment:
    name: Comment evaluation summary
    needs: eval
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: promptfoo-*

      - name: Publish summary on the PR
        uses: actions/github-script@v7
        env:
          EVAL_STATUS: ${{ needs.eval.result }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const files = [];
            const walk = (dir) => {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.name.endsWith('.json')) files.push(full);
              }
            };
            walk('results');
            const lines = [
              `## Promptfoo evaluation — ${process.env.EVAL_STATUS}`,
              '',
              '| Prompt | Passaram | Falharam |',
              '|---|---:|---:|',
            ];
            for (const file of files) {
              const name = path.basename(file, '.json');
              const data = JSON.parse(fs.readFileSync(file, 'utf8').replace(/^\uFEFF/, ''));
              const results = Array.isArray(data.results)
                ? data.results
                : (data.results?.results || []);
              const passed = results.filter((result) => result.success).length;
              const failed = results.length - passed;
              lines.push(`| ${name} | ${passed} | ${failed} |`);
            }
            if (!files.length) lines.push('| Nenhum resultado disponível | — | — |');
            lines.push('', 'Resultados detalhados estão nos artifacts desta execução.');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });
